services:
  db:
    image: postgres:16-alpine
    container_name: cohort-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - cohort_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: cohort-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
    container_name: cohort-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # fl-service (Python + Flower + scikit-learn) is deliberately stubbed until
  # Sprint 4 (see docs/plan/BUILD_PHASES_JAVA.md, P50) — there's no code to
  # build yet, and wiring it in early would just be a container that fails
  # to start. Uncomment once fl-service/ has a real app.
  # fl-service:
  #   build:
  #     context: ./fl-service
  #   container_name: cohort-fl-service
  #   env_file:
  #     - .env
  #   ports:
  #     - "${FL_SERVICE_PORT:-8000}:8000"

volumes:
  cohort_db_data:
    name: cohort_db_data
