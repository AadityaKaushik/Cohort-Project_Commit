services:
  db:
    image: postgres:16-alpine
    container_name: cohort-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - cohort_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: cohort-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
    container_name: cohort-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules

  # fl-service lives in docker-compose.fl.yml:
  #   docker compose -f docker-compose.yml -f docker-compose.fl.yml up -d

volumes:
  cohort_db_data:
    name: cohort_db_data
