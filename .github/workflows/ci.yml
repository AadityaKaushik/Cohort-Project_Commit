name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-gates:
    name: Security gates: secret scan, string-built SQL (P81)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan every commit for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact

      - name: Reject SQL built from runtime values
        run: bash scripts/check-sql-interpolation.sh

  api:
    name: API: build, test, coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Docker is already available on the runner.
      - name: Build, run tests, and enforce the JaCoCo coverage gate
        working-directory: api
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: api/target/site/jacoco
          retention-days: 14

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api/target/surefire-reports
          retention-days: 14

  fl-db-isolation:
    name: fl-service: DB credential isolation (P50, US-61)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Build and start db, api, fl-service (fl profile)
        run: docker compose -f docker-compose.yml -f docker-compose.fl.yml up -d --build db api fl-service

      # The api container's Flyway run applies V19, which creates the fl schema and cohort_fl role.
      - name: Wait for the API to become healthy (proves Flyway migrations ran)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "API is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy." >&2
          docker compose -f docker-compose.yml -f docker-compose.fl.yml logs
          exit 1

      - name: Verify fl-service holds zero user-content DB credentials
        run: bash scripts/verify-fl-db-isolation.sh

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.fl.yml down -v

  frontend:
    name: Frontend: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
