[project]
name = "cohort-fl-service"
version = "0.0.0"
description = "Cohort federated-learning service (Flower + scikit-learn)."
requires-python = ">=3.11"
dependencies = [
    "flwr>=1.37,<2",
    "scikit-learn>=1.9,<2",
    "numpy>=2.5,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.setuptools]
packages = []
