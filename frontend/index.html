      try {
        var stored = localStorage.getItem('cohort-theme')
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
    <meta name="description" content="Job application tracker with interview preparation." />
