server:
  port: 8080

spring:
  application:
    name: cohort-api
  jackson:
    # The API contract is snake_case, so map it globally.
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cohort}}
    username: ${POSTGRES_USER:cohort_app}
    password: ${POSTGRES_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only ever checks it matches.
      ddl-auto: validate
  flyway:
    placeholders:
      # V19: password for the cohort_fl role (P50). Same env var as docker-compose.fl.yml.
      flPassword: ${FL_POSTGRES_PASSWORD:change_me_too}
  servlet:
    multipart:
      # Above the 5 MB resume cap (FR-30), so the size check in ValidatingFileStorage gives the error.
      max-file-size: 6MB
      max-request-size: 7MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-use-00000}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  oauth:
    # US-93: a provider is offered only when both its id and secret are set.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  mail:
    sender: ${APP_MAIL_SENDER:log}
  auth:
    password-reset-ttl-minutes: 60
    email-verification-ttl-hours: 24
    login-rate-limit:
      max-attempts: 10
      window-minutes: 15
  resume-storage:
    # Local disk. Swap FileStorageStrategy for S3.
    base-dir: ${RESUME_STORAGE_DIR:./data/resumes}
  report-storage:
    # US-80: generated PDF/CSV exports, in a separate root from resumes.
    base-dir: ${REPORT_STORAGE_DIR:./data/reports}
  reports:
    # FR-104: how long an export stays downloadable before ReportExpiryJob deletes it.
    ttl: ${APP_REPORTS_TTL:P7D}
    # Oldest exports beyond this many per user are pruned on each new export.
    max-per-user: ${APP_REPORTS_MAX_PER_USER:20}
    cleanup-interval: ${APP_REPORTS_CLEANUP_INTERVAL:PT1H}
  notifications:
    # NFR-53: NotificationChannel ids to deliver with, in order. Only in_app exists.
    channels: ${APP_NOTIFICATION_CHANNELS:in_app}
    detection:
      # US-76..78: how often NotificationDetectionJob scans. Re-runs are idempotent.
      initial-delay: ${APP_NOTIFICATION_DETECTION_INITIAL_DELAY:PT1M}
      interval: ${APP_NOTIFICATION_DETECTION_INTERVAL:PT15M}
  fl:
    # P51/P52: fl-service base URL. docker-compose.fl.yml overrides it to http://fl-service:8000.
    service-base-url: ${APP_FL_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${APP_FL_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${APP_FL_READ_TIMEOUT_MS:3000}
    export:
      # US-58: feature export job. Every 6 hours.
      cron: ${APP_FL_EXPORT_CRON:0 0 */6 * * *}
    round:
      # US-61/US-63: 30 minutes after the export, so rounds use fresh features.
      cron: ${APP_FL_ROUND_CRON:0 30 */6 * * *}

  ai:
    # US-102: local Ollama by default. Gemini is used only when
    # AI_PROVIDER=gemini and a key is set; prompts then leave the server.
    provider: ${AI_PROVIDER:ollama}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:90000}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.2:3b}
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
    rate-limit:
      max-requests: ${AI_RATE_LIMIT_MAX_REQUESTS:30}
      window-minutes: ${AI_RATE_LIMIT_WINDOW_MINUTES:60}

resilience4j:
  circuitbreaker:
    instances:
      flService:
        # P53: small window so a few failures open the breaker quickly.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.cohort.api.service.fl.FlServiceUnavailableException

# P109: the OpenAPI document is only for the security suite, not served in a running app.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}

cohort:
  contributions:
    salt: ${CONTRIBUTION_SALT:local-development-salt}
