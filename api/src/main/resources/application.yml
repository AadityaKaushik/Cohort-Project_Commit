server:
  port: 8080

spring:
  application:
    name: cohort-api
  jackson:
    # The API contract (PROJECT_PLAN.md §18) is snake_case end to end;
    # this maps it automatically instead of annotating every DTO field.
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cohort}}
    username: ${POSTGRES_USER:cohort_app}
    password: ${POSTGRES_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only ever checks it matches.
      ddl-auto: validate
  flyway:
    placeholders:
      # V19: the password the isolated `cohort_fl` Postgres role is created
      # with (P50). Sourced from the same FL_POSTGRES_PASSWORD env var
      # docker-compose.fl.yml and .env.example already declare, never a
      # literal secret in the migration file itself.
      flPassword: ${FL_POSTGRES_PASSWORD:change_me_too}
  servlet:
    multipart:
      # Above the 5 MB resume cap (FR-30) so an oversized upload reaches
      # ValidatingFileStorage's own check and its FILE_TOO_LARGE error
      # envelope, instead of being rejected earlier by Spring's own (default
      # 1 MB) multipart limit with a generic error.
      max-file-size: 6MB
      max-request-size: 7MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-use-00000}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  auth:
    login-rate-limit:
      max-attempts: 10
      window-minutes: 15
  resume-storage:
    # Local disk today (Strategy pattern, US-21); an S3-backed implementation
    # is a drop-in swap behind FileStorageStrategy without touching callers.
    base-dir: ${RESUME_STORAGE_DIR:./data/resumes}
  fl:
    # P51/P52: where fl-service's REST contract lives. In docker-compose.fl.yml
    # this is overridden to http://fl-service:8000 (container-to-container DNS).
    service-base-url: ${APP_FL_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${APP_FL_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${APP_FL_READ_TIMEOUT_MS:3000}
    export:
      # US-58: how often the sanitised feature export job (FlFeatureExportJob)
      # runs. Every 6 hours by default -- coarse enough that it never fires
      # within a test run's lifetime, so no test needs to disable it explicitly.
      cron: ${APP_FL_EXPORT_CRON:0 0 */6 * * *}
    round:
      # US-61/US-63: offset 30 minutes after the export cron so a round
      # always runs against freshly-exported features, not a race with them.
      cron: ${APP_FL_ROUND_CRON:0 30 */6 * * *}

resilience4j:
  circuitbreaker:
    instances:
      flService:
        # P53: small window so a handful of real failures (fl-service down
        # or mid-deploy) trips the breaker quickly rather than waiting for
        # a large sample -- this is an MVP-scale service, not a
        # high-throughput one, per the same "smallest commits, real
        # numbers" spirit as US-61's min-cohort default.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.cohort.api.service.fl.FlServiceUnavailableException
